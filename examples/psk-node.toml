[node]
name = "psk-node"
state_dir = "./state/psk-node"
overlay_ip = "10.7.0.1"

[network]
name = "demo"
cidr = "10.7.0.0/16"

[network.auth]
mode = "psk"
secret = "change-me-to-a-long-random-secret"
