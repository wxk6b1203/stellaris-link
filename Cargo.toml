[workspace]
resolver = "2"
members = [
    "crates/stellaris-types",
    "crates/stellaris-fib",
    "crates/stellaris-routing",
    "crates/stellaris-linkstate",
    "crates/stellaris-agent",
    "crates/stellaris-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/stellaris-linking"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1.9"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
ipnet = { version = "2", features = ["serde"] }
iroh = "1.5"
prefix-trie = "0.10"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tun-rs = { version = "2.8", features = ["async"] }
uuid = { version = "1", features = ["v5", "v7", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
